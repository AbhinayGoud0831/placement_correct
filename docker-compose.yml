version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: placement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: placement_user
      POSTGRES_PASSWORD: placement_pass
      POSTGRES_DB: placement_db
    ports:
      - "5432:5432"
    volumes:
      - placement_pg_data:/var/lib/postgresql/data

volumes:
  placement_pg_data:
